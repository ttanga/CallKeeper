name: Go checks
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o callkeeper-bin .
      - run: bash -n install.sh manage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: callkeeper-linux
          path: callkeeper-bin
